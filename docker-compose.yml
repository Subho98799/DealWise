# OPTIONAL: local Postgres via Docker. The primary setup is Neon without Docker (README).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Local-only owner password. Never reuse it anywhere else.
      POSTGRES_PASSWORD: postgres
      # app_user password: export APP_USER_PASSWORD=... (bash) / $env:APP_USER_PASSWORD="..." (PowerShell) before `docker compose up`
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD first}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./scripts/create_app_role.sql:/scripts/create_app_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealtracker"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
