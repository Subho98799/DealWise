name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env file may be tracked (only .env.example)
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Tracked env files: $bad"; exit 1; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Doc freshness (routes + migrations in docs/IMPLEMENTATION.md)
        run: python backend/scripts/check_docs.py
      - name: Python dependency audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: dealtracker_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_USER_PASSWORD: ci_only_app_user_password
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dealtracker_test
      TEST_DATABASE_URL: postgresql+psycopg://app_user:ci_only_app_user_password@localhost:5432/dealtracker_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: python scripts/create_role.py --test
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: dealtracker_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_USER_PASSWORD: ci_only_app_user_password
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dealtracker_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dealtracker_test
      E2E_DATABASE_URL: postgresql://app_user:ci_only_app_user_password@localhost:5432/dealtracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - name: Yarn dependency audit (non-blocking)
        continue-on-error: true
        run: yarn audit --groups dependencies
        working-directory: frontend
      - run: yarn lint && yarn typecheck && yarn test && yarn build
        working-directory: frontend
      - name: Start backend on the test database
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          python scripts/create_role.py --test
          alembic upgrade head
          ENV=dev DATABASE_URL=postgresql+psycopg://app_user:ci_only_app_user_password@localhost:5432/dealtracker_test \
          GOOGLE_CLIENT_ID=ci-only.apps.googleusercontent.com GOOGLE_CLIENT_SECRET=ci SESSION_SECRET=ci-only-session-secret-0123456789abcdef \
          FRONTEND_URL=http://localhost:4173 RATE_LIMIT_ENABLED=false nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - name: Playwright e2e
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          (yarn preview > /tmp/preview.log 2>&1 &)
          for i in $(seq 60); do curl -sf localhost:4173/api/health && break; sleep 1; done
          yarn e2e
