<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="keywords" content="%SEO_KEYWORDS%" />
    <meta name="application-name" content="%APP_NAME%" />
    <meta name="author" content="%BRAND_NAME%" />
    <meta name="publisher" content="%BRAND_NAME%" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="%SEO_URL%/" />
    <link rel="alternate" hreflang="en-in" href="%SEO_URL%/" />
    <link rel="alternate" hreflang="x-default" href="%SEO_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:url" content="%SEO_URL%/" />
    <meta property="og:image" content="%SEO_IMAGE_URL%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="%SEO_IMAGE_WIDTH%" />
    <meta property="og:image:height" content="%SEO_IMAGE_HEIGHT%" />
    <meta property="og:image:alt" content="%SEO_IMAGE_ALT%" />
    <meta property="og:image:secure_url" content="%SEO_IMAGE_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_IMAGE_URL%" />
    <meta name="twitter:image:alt" content="%SEO_IMAGE_ALT%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_SHORT_NAME%" />
    <meta name="theme-color" content="" />
    <script src="/theme-init.js"></script>
    <script type="application/ld+json">%SEO_JSON_LD%</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DealBook by Vfinite is a review deal management app that needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
